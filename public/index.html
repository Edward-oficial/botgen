<!DOCTYPE html>
<html lang="es">
<head>

<script src="https://quge5.com/88/tag.min.js" data-zone="270994" async data-cfasync="false"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de bots · Duan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; background: #050607; color: #e7ecf3;
    font-family: 'Inter', sans-serif; padding: 28px 14px 70px;
  }
  .wrap { max-width: 580px; margin: 0 auto; }

  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  p.sub { color: #8a94a3; font-size: 13px; margin: 0 0 18px; line-height: 1.5; }

  .setup {
    background: #0b0e14; border: 1px solid #1c2733;
    border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .setup-grid { grid-template-columns: 1fr; } }

  label { display: block; font-size: 11px; color: #8a94a3; margin-bottom: 5px; }
  input[type="text"], textarea {
    width: 100%; background: #05070a; border: 1px solid #1c2733; color: #e7ecf3;
    padding: 9px 11px; border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif;
  }
  input:focus, textarea:focus { outline: none; border-color: #1d4ed8; }

  .chat {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 12px; max-height: 48vh; overflow-y: auto;
    padding-right: 4px;
  }
  .bubble {
    padding: 10px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    word-break: break-word;
  }
  .bubble.user {
    background: #12203a; border: 1px solid #1e3a5f;
    align-self: flex-end; max-width: 88%;
  }
  .bubble.ai {
    background: #0b0e14; border: 1px solid #1c2733;
    align-self: flex-start; max-width: 95%;
  }

  .files { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .file-tab {
    background: #12203a; border: 1px solid #1e3a5f; color: #8fb4ff;
    padding: 5px 10px; border-radius: 6px; font-size: 11.5px;
    cursor: pointer; font-family: monospace;
  }
  .file-tab:hover { background: #17294a; }
  .file-tab.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

  .code-view {
    margin-top: 10px; background: #05070a; border: 1px solid #1c2733;
    border-radius: 8px; padding: 12px; font-family: Consolas, monospace;
    font-size: 11.5px; color: #b8c4d4; overflow: auto;
    white-space: pre; max-height: 280px;
  }

  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-height: 72px; resize: vertical; line-height: 1.4;
  }

  .send-btn {
    background: #1d4ed8;
    color: #fff;
    border: none;
    width: 42px;
    height: 42px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .send-btn:hover { background: #1e40af; }
  .send-btn:disabled { background: #1c2733; color: #6b7686; cursor: not-allowed; }

  .download-bar {
    display: none; margin-top: 14px; align-items: center;
    justify-content: space-between; gap: 10px;
    background: #0b0e14; border: 1px solid #1c2733;
    border-radius: 10px; padding: 12px 14px;
  }
  .download-bar span { font-size: 12.5px; color: #8a94a3; }
  .download-btn {
    background: #16a34a; color: #fff; border: none; padding: 9px 15px;
    border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .download-btn:hover { background: #15803d; }

  .status { font-size: 12px; color: #8a94a3; margin-top: 8px; min-height: 16px; }
  .status.err { color: #e0837a; }
  .status.ok { color: #4ade80; }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #8fb4ff;
    font-size: 13px;
    font-weight: 500;
  }
  .thinking .dots span {
    animation: blink 1.2s infinite;
    opacity: 0.2;
  }
  .thinking .dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generador de bots de WhatsApp</h1>
  <p class="sub">Pedí comandos, revisá el código, corregí lo que quieras y descargá cuando estés conforme.</p>

  <div class="setup">
    <div class="setup-grid">
      <div>
        <label>Nombre del bot</label>
        <input type="text" id="botName" placeholder="Mi Bot">
      </div>
      <div>
        <label>Creador (opcional)</label>
        <input type="text" id="creator" placeholder="Tu nombre">
      </div>
      <div>
        <label>Número del dueño (opcional)</label>
        <input type="text" id="ownerNumber" placeholder="50499999999">
      </div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-row">
    <textarea id="instruction" placeholder="Ej: quiero un comando sticker y un menu que liste todo"></textarea>
    <button class="send-btn" id="sendBtn" title="Enviar">➤</button>
  </div>
  <div class="status" id="status"></div>

  <div class="download-bar" id="downloadBar">
    <span id="fileCount">0 archivos listos</span>
    <button class="download-btn" id="downloadBtn">Descargar zip</button>
  </div>
</div>

<script>
let plugins = [];

const chat = document.getElementById('chat');
const status = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');
const instructionEl = document.getElementById('instruction');
const downloadBar = document.getElementById('downloadBar');
const fileCount = document.getElementById('fileCount');

function saveState() {
  localStorage.setItem('duanx_plugins', JSON.stringify(plugins));
  localStorage.setItem('duanx_botName', document.getElementById('botName').value);
  localStorage.setItem('duanx_creator', document.getElementById('creator').value);
  localStorage.setItem('duanx_ownerNumber', document.getElementById('ownerNumber').value);
}

function loadState() {
  try {
    const saved = localStorage.getItem('duanx_plugins');
    if (saved) {
      plugins = JSON.parse(saved);
      if (plugins.length) {
        renderFilesBubble();
        updateDownloadBar();
      }
    }

    const botName = localStorage.getItem('duanx_botName');
    const creator = localStorage.getItem('duanx_creator');
    const ownerNumber = localStorage.getItem('duanx_ownerNumber');

    if (botName) document.getElementById('botName').value = botName;
    if (creator) document.getElementById('creator').value = creator;
    if (ownerNumber) document.getElementById('ownerNumber').value = ownerNumber;
  } catch (_) {}
}

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderFilesBubble() {
  const div = document.createElement('div');
  div.className = 'bubble ai';

  const label = document.createElement('div');
  label.textContent = `${plugins.length} archivo(s) generados. Tocá uno para ver el código:`;
  div.appendChild(label);

  const filesRow = document.createElement('div');
  filesRow.className = 'files';

  const codeView = document.createElement('div');
  codeView.className = 'code-view';
  codeView.textContent = plugins[0]?.code || '';

  plugins.forEach((p, i) => {
    const tab = document.createElement('span');
    tab.className = 'file-tab' + (i === 0 ? ' active' : '');
    tab.textContent = p.filename;
    tab.addEventListener('click', () => {
      filesRow.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      codeView.textContent = p.code;
    });
    filesRow.appendChild(tab);
  });

  div.appendChild(filesRow);
  div.appendChild(codeView);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateDownloadBar() {
  if (plugins.length) {
    downloadBar.style.display = 'flex';
    fileCount.textContent = `${plugins.length} archivo(s) listos`;
  } else {
    downloadBar.style.display = 'none';
  }
}

async function send() {
  const instruction = instructionEl.value.trim();
  if (!instruction) return;

  addBubble(instruction, 'user');
  instructionEl.value = '';
  sendBtn.disabled = true;

  status.innerHTML = `
    <div class="thinking">
      <span>DuanX</span>
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  `;
  status.className = 'status';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ existingPlugins: plugins, instruction }),
    });
    const data = await res.json();

    if (!data.status) {
      let msg = data.error || 'Error desconocido';
      if (msg.includes('rate limit') || msg.includes('Rate limit') || msg.includes('429')) {
        msg = 'Límite de Groq alcanzado. Esperá unos segundos e intentá de nuevo.';
      }
      status.textContent = 'Error: ' + msg;
      status.className = 'status err';
      sendBtn.disabled = false;
      return;
    }

    plugins = data.plugins;
    renderFilesBubble();
    updateDownloadBar();
    saveState();
    status.textContent = 'Listo';
    status.className = 'status ok';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status err';
  }

  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', send);
instructionEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

['botName', 'creator', 'ownerNumber'].forEach(id => {
  document.getElementById(id).addEventListener('input', saveState);
});

document.getElementById('downloadBtn').addEventListener('click', async () => {
  const botName = document.getElementById('botName').value.trim() || 'Mi Bot';
  const creator = document.getElementById('creator').value.trim();
  const ownerNumber = document.getElementById('ownerNumber').value.trim();

  status.textContent = 'Armando el zip...';
  status.className = 'status';

  try {
    const res = await fetch('/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ botName, creator, ownerNumber, plugins }),
    });

    if (!res.ok) {
      const data = await res.json();
      status.textContent = 'Error: ' + data.error;
      status.className = 'status err';
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = botName.replace(/\s+/g, '-') + '.zip';
    a.click();
    URL.revokeObjectURL(url);
    saveState();
    status.textContent = 'Zip descargado';
    status.className = 'status ok';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status err';
  }
});

loadState();
</script>
</body>
</html>
