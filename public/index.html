<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de bots · Duan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; background: #050607; color: #e7ecf3;
    font-family: 'Inter', sans-serif; padding: 32px 16px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p.sub { color: #8a94a3; font-size: 12.5px; margin: 0 0 20px; line-height: 1.5; }

  .setup { background: #0b0e14; border: 1px solid #1c2733; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .setup-grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: 11px; color: #8a94a3; margin-bottom: 5px; }
  input[type="text"] {
    width: 100%; background: #05070a; border: 1px solid #1c2733; color: #e7ecf3;
    padding: 8px 10px; border-radius: 5px; font-size: 13px; font-family: 'Inter', sans-serif;
  }

  .chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .bubble { padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
  .bubble.user { background: #12203a; border: 1px solid #1e3a5f; align-self: flex-end; max-width: 85%; }
  .bubble.ai { background: #0b0e14; border: 1px solid #1c2733; }

  .files { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .file-tab {
    background: #12203a; border: 1px solid #1e3a5f; color: #8fb4ff;
    padding: 5px 10px; border-radius: 5px; font-size: 11.5px; cursor: pointer; font-family: monospace;
  }
  .file-tab:hover { background: #17294a; }
  .file-tab.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }

  .code-view {
    margin-top: 10px; background: #05070a; border: 1px solid #1c2733; border-radius: 6px;
    padding: 12px; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px;
    color: #b8c4d4; overflow-x: auto; white-space: pre; max-height: 320px; overflow-y: auto;
  }

  .input-row { display: flex; gap: 8px; margin-top: 4px; }
  textarea {
    flex: 1; background: #0b0e14; border: 1px solid #1c2733; color: #e7ecf3;
    padding: 10px 12px; border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif;
    min-height: 70px; resize: vertical;
  }
  .send-btn {
    background: #1d4ed8; color: #fff; border: none; padding: 0 18px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .send-btn:hover { background: #1e40af; }
  .send-btn:disabled { background: #1c2733; color: #6b7686; cursor: not-allowed; }

  .download-bar {
    display: none; margin-top: 16px; align-items: center; justify-content: space-between;
    background: #0b0e14; border: 1px solid #1c2733; border-radius: 8px; padding: 14px 16px;
  }
  .download-bar span { font-size: 12.5px; color: #8a94a3; }
  .download-btn {
    background: #16a34a; color: #fff; border: none; padding: 9px 16px;
    border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .download-btn:hover { background: #15803d; }

  .status { font-size: 12px; color: #8a94a3; margin-top: 8px; min-height: 14px; }
  .status.err { color: #e0837a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generador de bots de WhatsApp</h1>
  <p class="sub">Basado en Baby Ania. Pedí comandos, revisá el código, corregí lo que quieras, y descargá cuando estés conforme.</p>

  <div class="setup">
    <div class="setup-grid">
      <div>
        <label>Nombre del bot</label>
        <input type="text" id="botName" placeholder="Mi Bot">
      </div>
      <div>
        <label>Creador (opcional)</label>
        <input type="text" id="creator" placeholder="Tu nombre">
      </div>
      <div>
        <label>Número del dueño (opcional)</label>
        <input type="text" id="ownerNumber" placeholder="50499999999">
      </div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-row">
    <textarea id="instruction" placeholder="Ej: quiero un comando sticker que convierta una imagen citada en figurita"></textarea>
    <button class="send-btn" id="sendBtn">Enviar</button>
  </div>
  <div class="status" id="status"></div>

  <div class="download-bar" id="downloadBar">
    <span id="fileCount">0 archivos listos</span>
    <button class="download-btn" id="downloadBtn">Descargar zip</button>
  </div>
</div>

<script>
let plugins = [];
let activeFile = null;

const chat = document.getElementById('chat');
const status = document.getElementById('status');
const sendBtn = document.getElementById('sendBtn');
const instructionEl = document.getElementById('instruction');
const downloadBar = document.getElementById('downloadBar');
const fileCount = document.getElementById('fileCount');

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": '&#39;' }[c]));
}

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  chat.appendChild(div);
  return div;
}

function renderFilesBubble() {
  const div = document.createElement('div');
  div.className = 'bubble ai';

  const label = document.createElement('div');
  label.textContent = `${plugins.length} archivo(s) generados. Tocá uno para ver el código:`;
  div.appendChild(label);

  const filesRow = document.createElement('div');
  filesRow.className = 'files';

  plugins.forEach((p) => {
    const tab = document.createElement('span');
    tab.className = 'file-tab';
    tab.textContent = p.filename;
    tab.addEventListener('click', () => {
      filesRow.querySelectorAll('.file-tab').forEach((t) => t.classList.remove('active'));
      tab.classList.add('active');
      codeView.textContent = p.code;
    });
    filesRow.appendChild(tab);
  });

  div.appendChild(filesRow);

  const codeView = document.createElement('div');
  codeView.className = 'code-view';
  codeView.textContent = plugins[0]?.code || '';
  div.appendChild(codeView);

  if (filesRow.firstChild) filesRow.firstChild.classList.add('active');

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function updateDownloadBar() {
  if (plugins.length) {
    downloadBar.style.display = 'flex';
    fileCount.textContent = `${plugins.length} archivo(s) listos`;
  } else {
    downloadBar.style.display = 'none';
  }
}

async function send() {
  const instruction = instructionEl.value.trim();
  if (!instruction) return;

  addBubble(instruction, 'user');
  instructionEl.value = '';
  sendBtn.disabled = true;
  status.textContent = 'Pensando...';
  status.className = 'status';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ existingPlugins: plugins, instruction }),
    });
    const data = await res.json();

    if (!data.status) {
      status.textContent = 'Error: ' + data.error;
      status.className = 'status err';
      sendBtn.disabled = false;
      return;
    }

    plugins = data.plugins;
    renderFilesBubble();
    updateDownloadBar();
    status.textContent = '';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status err';
  }

  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', send);
instructionEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

document.getElementById('downloadBtn').addEventListener('click', async () => {
  const botName = document.getElementById('botName').value.trim() || 'Mi Bot';
  const creator = document.getElementById('creator').value.trim();
  const ownerNumber = document.getElementById('ownerNumber').value.trim();

  status.textContent = 'Armando el zip...';
  status.className = 'status';

  try {
    const res = await fetch('/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ botName, creator, ownerNumber, plugins }),
    });

    if (!res.ok) {
      const data = await res.json();
      status.textContent = 'Error: ' + data.error;
      status.className = 'status err';
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = botName.replace(/\s+/g, '-') + '.zip';
    a.click();
    URL.revokeObjectURL(url);
    status.textContent = 'Listo, se descargó el zip.';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status err';
  }
});
</script>
</body>
</html>
