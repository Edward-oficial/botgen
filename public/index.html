<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de bots · Duan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100vh; background: #050607; color: #e7ecf3;
    font-family: 'Inter', sans-serif; padding: 40px 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #8a94a3; font-size: 13px; margin: 0 0 24px; line-height: 1.5; }
  .card { background: #0b0e14; border: 1px solid #1c2733; border-radius: 8px; padding: 20px; }
  label { display: block; font-size: 12px; color: #8a94a3; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], textarea {
    width: 100%; background: #05070a; border: 1px solid #1c2733; color: #e7ecf3;
    padding: 10px 12px; border-radius: 6px; font-size: 13.5px; font-family: 'Inter', sans-serif;
  }
  textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
  button {
    width: 100%; margin-top: 18px; padding: 11px; background: #1d4ed8; color: #fff;
    border: none; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1e40af; }
  button:disabled { background: #1c2733; color: #6b7686; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 12.5px; color: #8a94a3; min-height: 16px; }
  .status.err { color: #e0837a; }
  .status.ok { color: #4d8cff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generador de bots de WhatsApp</h1>
  <p class="sub">Basado en Baby Ania. Describí qué comandos querés y te armo el bot completo en un zip.</p>

  <div class="card">
    <label>Nombre del bot</label>
    <input type="text" id="botName" placeholder="Mi Bot">

    <label>Creador (opcional)</label>
    <input type="text" id="creator" placeholder="Tu nombre">

    <label>Número del dueño, con código de país (opcional)</label>
    <input type="text" id="ownerNumber" placeholder="50499999999">

    <label>Especificaciones</label>
    <textarea id="specs" placeholder="Ej: quiero un comando sticker que convierta una imagen citada en figurita, y un comando clima que reciba una ciudad y devuelva el clima actual."></textarea>

    <button id="genBtn">Generar bot</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
document.getElementById('genBtn').addEventListener('click', async () => {
  const botName = document.getElementById('botName').value.trim();
  const creator = document.getElementById('creator').value.trim();
  const ownerNumber = document.getElementById('ownerNumber').value.trim();
  const specs = document.getElementById('specs').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('genBtn');

  if (!botName || !specs) {
    status.textContent = 'Completá el nombre y las especificaciones.';
    status.className = 'status err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generando...';
  status.textContent = 'Esto puede tardar un rato mientras la IA arma y valida los comandos...';
  status.className = 'status';

  try {
    const res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ botName, creator, ownerNumber, specs }),
    });

    if (!res.ok) {
      const data = await res.json();
      status.textContent = 'Error: ' + data.error;
      status.className = 'status err';
      return;
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = botName.replace(/\s+/g, '-') + '.zip';
    a.click();
    URL.revokeObjectURL(url);

    status.textContent = 'Listo, se descargó el zip.';
    status.className = 'status ok';
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
    status.className = 'status err';
  }

  btn.disabled = false;
  btn.textContent = 'Generar bot';
});
</script>
</body>
</html>
